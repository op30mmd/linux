name: Build patched amdgpu kernel (Ubuntu 26.04 LTS)

on:
  workflow_dispatch:

permissions:
  contents: write          # required to create releases + tags

env:
  LOCALVERSION: -amdgpu-od

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04    # guarantees the build runs against Ubuntu 26.04 LTS
    timeout-minutes: 330
    steps:
      - name: Install git (so checkout can persist credentials)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - name: Checkout kernel source (this repo, already patched)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain & build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio kmod rsync zstd xz-utils \
            libssl-dev libelf-dev libdw-dev libncurses-dev dwarves \
            python3 lsb-release dh-exec fakeroot debhelper gawk
          # GitHub CLI publishes the release; fall back to the upstream apt repo
          apt-get install -y --no-install-recommends gh || {
            install -m 0755 -d /usr/share/keyrings
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              -o /usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              > /etc/apt/sources.list.d/github-cli.list
            apt-get update
            apt-get install -y gh
          }

      - name: Configure the kernel (Ubuntu standard config)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Base on Ubuntu's STOCK kernel config (so all drivers + initramfs
          # modules are present and the kernel boots like a normal Ubuntu one).
          apt-get install -y --no-install-recommends linux-image-generic
          SRC_CONFIG="$(ls -1 /boot/config-*-generic 2>/dev/null | sort -V | tail -n1)"
          [ -z "$SRC_CONFIG" ] && SRC_CONFIG="$(ls -1 /boot/config-* 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SRC_CONFIG" ]; then
            echo "::error::Could not find an Ubuntu /boot/config-* to base on."
            exit 1
          fi
          echo "Using Ubuntu base config: $SRC_CONFIG"
          cp "$SRC_CONFIG" .config
          # ---- assert the must-haves on top of Ubuntu's config ----
          ./scripts/config --enable  UNIX            # AF_UNIX boot-freeze fix (Ubuntu sets it too)
          ./scripts/config --module  DRM_AMDGPU
          ./scripts/config --enable  DRM_AMDGPU_SI   # Oland / Southern Islands (your OD patch)
          ./scripts/config --enable  DRM_AMD_DC_SI
          # ---- make Ubuntu's config buildable off-Ubuntu + fit the free runner ----
          ./scripts/config --disable MODULE_SIG
          ./scripts/config --disable MODULE_SIG_ALL
          ./scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          ./scripts/config --set-str SYSTEM_REVOCATION_KEYS ""
          ./scripts/config --disable GCC_PLUGINS
          ./scripts/config --disable DEBUG_INFO
          ./scripts/config --disable DEBUG_INFO_DWARF5
          ./scripts/config --disable DEBUG_INFO_DWARF4
          ./scripts/config --disable DEBUG_INFO_BTF
          ./scripts/config --disable DEBUG_INFO_BTF_MODULES
          ./scripts/config --disable DEBUG_INFO_REDUCED
          ./scripts/config --set-str LOCALVERSION "$LOCALVERSION"
          ./scripts/config --disable LOCALVERSION_AUTO
          make olddefconfig       # adapt Ubuntu's config to this tree, non-interactively
          echo "=== sanity check ==="
          grep -E '^(CONFIG_UNIX|CONFIG_DRM_AMDGPU_SI|CONFIG_DRM_AMDGPU|CONFIG_MODULE_SIG|CONFIG_DEBUG_INFO)=' .config || true

      - name: Build .deb packages
        run: |
          make -j"$(nproc)" bindeb-pkg LOCALVERSION="$LOCALVERSION"
          mkdir -p out
          mv ../*.deb out/ 2>/dev/null || true
          ls -lh out

      - name: Publish release with automatic tag
        run: |
          set -euo pipefail
          TAG="kernel-$(date -u +%Y%m%d-%H%M)-r${GITHUB_RUN_NUMBER}"
          # Recover the token actions/checkout persisted by reading .git/config
          # directly (robust against git ownership checks; needs no secret expression).
          CFG="$GITHUB_WORKSPACE/.git/config"
          B64="$(grep -aoE 'AUTHORIZATION:[[:space:]]+basic[[:space:]]+[A-Za-z0-9+/=]+' "$CFG" 2>/dev/null | head -n1 | awk '{print $NF}')"
          if [ -z "$B64" ]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
            B64="$(git config --get-regexp 'http\..*\.extraheader' 2>/dev/null | head -n1 | awk '{print $NF}')"
          fi
          TOKEN="$(printf '%s' "$B64" | base64 -d 2>/dev/null | cut -d: -f2- || true)"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Could not recover the build token. Leave actions/checkout 'persist-credentials' at its default (true)."
            exit 1
          fi
          export GH_TOKEN="$TOKEN"
          gh release create "$TAG" out/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Patched amdgpu kernel ($TAG)" \
            --notes "Automated build on the Ubuntu 26.04 LTS toolchain. Install with: sudo dpkg -i linux-image-*.deb linux-headers-*.deb && sudo reboot"
